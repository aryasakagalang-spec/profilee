<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }
        .header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            padding: 40px 20px 20px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #fff;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 4px solid #fff;
        }
        .name {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
        }
        .bio {
            color: #dfe6e9;
            font-size: 14px;
            margin-top: 5px;
        }
        .content {
            padding: 25px 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #6c5ce7;
            margin-bottom: 10px;
            text-align: left;
        }
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .skill-tag {
            background: #eef0fd;
            color: #6c5ce7;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .socials {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .social-link {
            text-decoration: none;
            color: #fff;
            background-color: #2d3436;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .social-link:hover {
            background-color: #6c5ce7;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="avatar">😎</div>
            <div class="name">Nama Kamu</div>
            <div class="bio">Pelajar / Hobi Koding / Desainer</div>
        </div>
        
        <div class="content">
            <div class="section-title">Keahlian & Hobi</div>
            <div class="skills">
                <span class="skill-tag">HTML & CSS</span>
                <span class="skill-tag">Desain</span>
                <span class="skill-tag">Gaming</span>
                <span class="skill-tag">Musik</span>
            </div>

            <div class="section-title">Hubungi Saya</div>
            <div class="socials">
                <a href="#" class="social-link">Instagram</a>
                <a href="#" class="social-link">GitHub</a>
            </div>
        </div>
    </div>

</body>
</html>
